services:
  minio:
    image: minio/minio:latest
    container_name: nimbus-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - nimbus-net

  ollama:
    image: ollama/ollama:latest
    container_name: nimbus-ollama
    environment:
      OLLAMA_NUM_PARALLEL:      ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      HSA_OVERRIDE_GFX_VERSION: ${AMD_GFX_VERSION:-11.0.0}
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # GPU NVIDIA — descomente se disponivel:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    #
    # GPU AMD/ROCm — descomente se disponivel:
    # environment:
      
    # devices:
    #   - /dev/kfd
    #   - /dev/dri
    # group_add:
    #   - video
    # ipc: host
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - nimbus-net

  nimbus:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nimbus-pipeline
    depends_on:
      minio:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      DEFAULT_SCENARIO: ${DEFAULT_SCENARIO:-baseline}
      DEFAULT_FORMAT:   ${DEFAULT_FORMAT:-all}
      USE_MINIO:        "true"
      MINIO_ENDPOINT:   minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      OLLAMA_HOST:      http://ollama:11434
      OLLAMA_MODEL:     ${OLLAMA_MODEL:-phi3.5}
      SKIP_SLM:         ${SKIP_SLM:-false}
      PREFECT_API_URL:  http://127.0.0.1:4200/api
      DATABRICKS_HOST:         ${DATABRICKS_HOST:-}
      DATABRICKS_TOKEN:        ${DATABRICKS_TOKEN:-}
      DATABRICKS_WAREHOUSE_ID: ${DATABRICKS_WAREHOUSE_ID:-}
      DATABRICKS_AUTO_UPLOAD:  ${DATABRICKS_AUTO_UPLOAD:-false}
      DATABRICKS_VOLUME:    ${DATABRICKS_VOLUME:-landing}
      DATABRICKS_CATALOG:      ${DATABRICKS_CATALOG:-workspace}
      DATABRICKS_SCHEMA:       ${DATABRICKS_SCHEMA:-nimbus}
    ports:
      - "4200:4200"
    volumes:
      - ./data:/app/data
    networks:
      - nimbus-net
    restart: on-failure:3

volumes:
  minio_data:
    driver: local
  ollama_models:
    driver: local

networks:
  nimbus-net:
    driver: bridge
